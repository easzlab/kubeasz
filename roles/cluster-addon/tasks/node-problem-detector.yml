- block:
    - name: prepare some dirs for node-problem-detector
      file: name={{ cluster_dir }}/yml/node-problem-detector state=directory

    - name: 创建chart:node-problem-detector 个性化设置
      template: src=node-problem-detector/{{ item }}.j2 dest={{ cluster_dir }}/yml/node-problem-detector/{{ item }}
      with_items:
      - "values.yaml"

    - name: helm 部署 node-problem-detector
      shell: "{{ base_dir }}/bin/helm upgrade node-problem-detector --install -n kube-system \
              -f {{ cluster_dir }}/yml/node-problem-detector/values.yaml \
              {{ base_dir }}/roles/cluster-addon/files/node-problem-detector-2.4.1.tgz"

    - name: 轮询等待部署 node-problem-detector
      shell: "{{ base_dir }}/bin/helm ls -n kube-system|grep node-problem-detector|awk '{print $8}'"
      register: chart_status
      until: chart_status.stdout == "deployed"
      retries: 15
      delay: 5
      ignore_errors: true

  when: 'node_problem_detector_install == "yes"'
